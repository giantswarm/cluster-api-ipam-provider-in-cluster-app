{{- if .Values.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/capi-ipam-in-cluster-serving-cert'
  labels:
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/managed-by: '{{ .Release.Service }}'
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/version: '{{ .Chart.AppVersion }}'
    cluster.x-k8s.io/provider: ipam-in-cluster
    helm.sh/chart: '{{ .Chart.Name }}'
  name: capi-ipam-in-cluster-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: capi-ipam-in-cluster-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-ipam-cluster-x-k8s-io-v1alpha2-globalinclusterippool
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: default.globalinclusterippool.ipam.cluster.x-k8s.io
  rules:
  - apiGroups:
    - ipam.cluster.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - globalinclusterippools
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: capi-ipam-in-cluster-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-ipam-cluster-x-k8s-io-v1alpha2-globalinclusterprefixpool
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: default.globalinclusterprefixpool.ipam.cluster.x-k8s.io
  rules:
  - apiGroups:
    - ipam.cluster.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - globalinclusterprefixpools
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: capi-ipam-in-cluster-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-ipam-cluster-x-k8s-io-v1alpha2-inclusterippool
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: default.inclusterippool.ipam.cluster.x-k8s.io
  rules:
  - apiGroups:
    - ipam.cluster.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - inclusterippools
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: capi-ipam-in-cluster-webhook-service
      namespace: '{{ .Release.Namespace }}'
      path: /mutate-ipam-cluster-x-k8s-io-v1alpha2-inclusterprefixpool
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: default.inclusterprefixpool.ipam.cluster.x-k8s.io
  rules:
  - apiGroups:
    - ipam.cluster.x-k8s.io
    apiVersions:
    - v1alpha2
    operations:
    - CREATE
    - UPDATE
    resources:
    - inclusterprefixpools
  sideEffects: None
{{- end }}
